apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-bluegreen
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/jimmyjijith/argocd-gitops-lab.git
    targetRevision: main
    path: apps/nginx-bluegreen

  destination:
    server: https://kubernetes.default.svc
    namespace: bluegreen-demo

  ignoreDifferences:
    - group: ""
      kind: Service
      name: nginx-active
      namespace: bluegreen-demo
      jsonPointers:
        - /spec/selector
    - group: ""
      kind: Service
      name: nginx-preview
      namespace: bluegreen-demo
      jsonPointers:
        - /spec/selector

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

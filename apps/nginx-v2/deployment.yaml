
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gitops-v2
  namespace: gitops-demo-v2
  labels:
    app: nginx-gitops-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-gitops-v2
  template:
    metadata:
      labels:
        app: nginx-gitops-v2
    spec:
      containers:
        - name: nginx
          image: nginx:1.29.3-alpine
          ports:
            - containerPort: 80
